name: Update and publish

# Runs the whole pipeline: download -> parse -> test -> build -> publish.
# Any failed step stops the run, and nothing is published. A failed run opens a
# GitHub issue mentioning @jmh11, so GitHub emails him.
#
# The weekly schedule is OFF until Joshua approves it. To turn it on, remove the
# "#" in front of the three schedule lines below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 18 * 1-5,7-12 1"   # Mondays 18:17 UTC (1:17 pm EST / 2:17 pm EDT), every month but June
  #   - cron: "17 18 * 6 1-5"        # every weekday in June, decision season

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q pytest==8.3.4

      - name: Download official files
        run: python scripts/fetch_raw.py
      - name: Read the Granted & Noted list
        run: python scripts/parse_granted_list.py
      - name: Read the docket data
        run: python scripts/parse_dockets.py
      - name: Read the transcripts and audio pages
        run: python scripts/parse_transcripts.py
      - name: Run the tests
        run: python -m pytest -q
      - name: Build the page data
        run: python scripts/build.py
      - name: Show the build report
        if: always()
        run: test -f build_report.md && cat build_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save data to the repository
        run: |
          git config user.name "scotus-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site build_report.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi

      - name: Email Joshua about new cases and decisions
        if: hashFiles('notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Tracker update $(TZ=America/New_York date +%Y-%m-%d): needs your review" \
            --body-file notify.md
          rm notify.md

      - name: Email Joshua if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@jmh11, the Supreme Court Tracker's update run failed, so nothing was published this time."
            echo ""
            echo "The live page still shows the last good update. The failed step and its message are here:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ -f build_report.md ]; then echo "Build report:"; echo ""; cat build_report.md; fi
            echo ""
            echo "Open the project in Claude and ask what went wrong; nothing needs fixing on the page itself."
          } > failed.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Tracker update failed $(TZ=America/New_York date +%Y-%m-%d)" --body-file failed.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Email Joshua if publishing failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Tracker publish failed $(TZ=America/New_York date +%Y-%m-%d)" \
            --body "@jmh11, the update ran but publishing to the website failed, so the page wasn't refreshed. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
