name: Download raw docket files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official files
        run: python scripts/fetch_raw.py
      - name: Save the files to the repository
        run: |
          git config user.name "scotus-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No changes to the raw files."
          else
            git commit -m "Raw docket files downloaded $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
