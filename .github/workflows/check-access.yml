name: Check access to supremecourt.gov

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/check_access.py"
      - ".github/workflows/check-access.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_access.py
